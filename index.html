<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tosh Qaychi Qog'oz</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07071a;
      --card: #10102a;
      --border: #1e1e4a;
      --purple: #a78bfa;
      --pink: #f472b6;
      --green: #34d399;
      --gray: #6b7280;
      --white: #f1f5f9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(167,139,250,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(244,114,182,0.08) 0%, transparent 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: var(--white);
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* Header */
    .header { margin-bottom: 24px; }
    .title {
      font-family: 'Orbitron', monospace;
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .subtitle { font-size: 0.72rem; color: var(--gray); letter-spacing: 3px; text-transform: uppercase; }

    /* Score */
    .score-board {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 12px;
      margin-bottom: 20px;
    }
    .score-item { text-align: center; }
    .score-label { font-size: 0.6rem; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    .score-num {
      font-family: 'Orbitron', monospace;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }
    .score-num.you { color: var(--purple); text-shadow: 0 0 20px rgba(167,139,250,0.5); }
    .score-num.draw { color: var(--gray); }
    .score-num.cpu { color: var(--pink); text-shadow: 0 0 20px rgba(244,114,182,0.5); }
    .divider-line { width: 1px; height: 40px; background: var(--border); }

    /* Arena */
    .arena {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .arena::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--purple), var(--pink), transparent);
      opacity: 0.5;
    }
    .arena-inner {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .player-side { text-align: center; flex: 1; }
    .player-label { font-size: 0.6rem; color: var(--gray); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
    .choice-emoji {
      font-size: 3.5rem;
      display: block;
      min-height: 64px;
      line-height: 64px;
      filter: drop-shadow(0 0 12px rgba(167,139,250,0.3));
    }
    .choice-emoji.animate { animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn {
      0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .arena-vs {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
    }
    .vs-text {
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      color: var(--border);
      letter-spacing: 2px;
    }
    .vs-line { width: 1px; height: 30px; background: linear-gradient(to bottom, transparent, var(--border), transparent); }

    /* Result */
    .result-box {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .result {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 10px 24px;
      border-radius: 50px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }
    .result.idle { color: var(--gray); border-color: var(--border); background: var(--card); }
    .result.win { color: var(--purple); border-color: rgba(167,139,250,0.3); background: rgba(167,139,250,0.1); }
    .result.lose { color: var(--pink); border-color: rgba(244,114,182,0.3); background: rgba(244,114,182,0.1); }
    .result.draw { color: var(--gray); border-color: var(--border); background: var(--card); }

    /* Buttons */
    .choices {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .choice-btn {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      border: 2px solid var(--border);
      background: var(--card);
      font-size: 2.4rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .choice-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(167,139,250,0.15), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .choice-btn:hover {
      border-color: var(--purple);
      transform: translateY(-6px) scale(1.05);
      box-shadow: 0 12px 30px rgba(167,139,250,0.25);
    }
    .choice-btn:hover::after { opacity: 1; }
    .choice-btn:active { transform: translateY(0) scale(0.95); }

    .choice-labels {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .choice-labels span {
      width: 88px;
      font-size: 0.58rem;
      color: #374151;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Footer */
    .footer-btns { display: flex; gap: 10px; justify-content: center; }
    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--gray);
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 0.7rem;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .reset-btn:hover { border-color: var(--gray); color: var(--white); }

    /* Streak */
    .streak {
      font-size: 0.7rem;
      color: var(--gray);
      margin-bottom: 16px;
      letter-spacing: 1px;
      min-height: 20px;
    }
    .streak span { color: var(--green); font-weight: 600; }

    /* Win flash */
    @keyframes winFlash {
      0%, 100% { background-image: radial-gradient(ellipse at 20% 20%, rgba(167,139,250,0.08) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(244,114,182,0.08) 0%, transparent 60%); }
      50% { background-image: radial-gradient(ellipse at 50% 50%, rgba(167,139,250,0.18) 0%, transparent 70%), radial-gradient(ellipse at 80% 80%, rgba(244,114,182,0.08) 0%, transparent 60%); }
    }
    body.win-flash { animation: winFlash 0.5s ease; }
  </style>
</head>
<body>
<div class="game">
  <div class="header">
    <div class="title">TOSH · QAYCHI · QOG'OZ</div>
    <div class="subtitle">O'zbek o'yini</div>
  </div>

  <div class="score-board">
    <div class="score-item">
      <div class="score-label">Sen</div>
      <div class="score-num you" id="scoreYou">0</div>
    </div>
    <div class="divider-line"></div>
    <div class="score-item">
      <div class="score-label">Durang</div>
      <div class="score-num draw" id="scoreDraw">0</div>
    </div>
    <div class="divider-line"></div>
    <div class="score-item">
      <div class="score-label">CPU</div>
      <div class="score-num cpu" id="scoreCpu">0</div>
    </div>
  </div>

  <div class="arena">
    <div class="arena-inner">
      <div class="player-side">
        <div class="player-label">Sen</div>
        <span class="choice-emoji" id="yourChoice">❓</span>
      </div>
      <div class="arena-vs">
        <div class="vs-line"></div>
        <div class="vs-text">VS</div>
        <div class="vs-line"></div>
      </div>
      <div class="player-side">
        <div class="player-label">CPU</div>
        <span class="choice-emoji" id="cpuChoice">❓</span>
      </div>
    </div>
  </div>

  <div class="result-box">
    <div class="result idle" id="result">Tanlovingni qil! 👇</div>
  </div>

  <div class="streak" id="streak"></div>

  <div class="choices">
    <button class="choice-btn" onclick="play('tosh')">✊</button>
    <button class="choice-btn" onclick="play('qaychi')">✌️</button>
    <button class="choice-btn" onclick="play('qogoz')">🖐️</button>
  </div>

  <div class="choice-labels">
    <span>Tosh</span>
    <span>Qaychi</span>
    <span>Qog'oz</span>
  </div>

  <div class="footer-btns">
    <button class="reset-btn" onclick="resetGame()">↺ Qayta boshlash</button>
  </div>
</div>

<script>
  const choices = ['tosh', 'qaychi', 'qogoz'];
  const emoji = { tosh: '✊', qaychi: '✌️', qogoz: '🖐️' };
  let scoreYou = 0, scoreCpu = 0, scoreDraw = 0;
  let streak = 0;
  let playing = false;

  function play(userChoice) {
    if (playing) return;
    playing = true;

    const cpuChoice = choices[Math.floor(Math.random() * 3)];
    const yourEl = document.getElementById('yourChoice');
    const cpuEl = document.getElementById('cpuChoice');

    yourEl.className = 'choice-emoji';
    cpuEl.className = 'choice-emoji';

    yourEl.textContent = emoji[userChoice];
    void yourEl.offsetWidth;
    yourEl.className = 'choice-emoji animate';

    let count = 0;
    const interval = setInterval(() => {
      cpuEl.textContent = emoji[choices[Math.floor(Math.random() * 3)]];
      count++;
      if (count > 8) {
        clearInterval(interval);
        cpuEl.textContent = emoji[cpuChoice];
        void cpuEl.offsetWidth;
        cpuEl.className = 'choice-emoji animate';
        showResult(userChoice, cpuChoice);
        playing = false;
      }
    }, 70);
  }

  function showResult(user, cpu) {
    const el = document.getElementById('result');
    const streakEl = document.getElementById('streak');
    el.className = 'result';

    const wins = (user === 'tosh' && cpu === 'qaychi') ||
                 (user === 'qaychi' && cpu === 'qogoz') ||
                 (user === 'qogoz' && cpu === 'tosh');

    if (user === cpu) {
      el.textContent = '🤝 Durang!';
      el.classList.add('draw');
      scoreDraw++;
      document.getElementById('scoreDraw').textContent = scoreDraw;
      streak = 0;
      streakEl.innerHTML = '';
    } else if (wins) {
      el.textContent = '🎉 Sen yutding!';
      el.classList.add('win');
      scoreYou++;
      document.getElementById('scoreYou').textContent = scoreYou;
      streak++;
      document.body.className = 'win-flash';
      setTimeout(() => document.body.className = '', 500);
      if (streak >= 2) {
        streakEl.innerHTML = `🔥 <span>${streak} ta ketma-ket g'alaba!</span>`;
      } else {
        streakEl.innerHTML = '';
      }
    } else {
      el.textContent = '😅 CPU yutdi!';
      el.classList.add('lose');
      scoreCpu++;
      document.getElementById('scoreCpu').textContent = scoreCpu;
      streak = 0;
      streakEl.innerHTML = '';
    }
  }

  function resetGame() {
    scoreYou = scoreCpu = scoreDraw = streak = 0;
    document.getElementById('scoreYou').textContent = 0;
    document.getElementById('scoreCpu').textContent = 0;
    document.getElementById('scoreDraw').textContent = 0;
    document.getElementById('yourChoice').textContent = '❓';
    document.getElementById('cpuChoice').textContent = '❓';
    const el = document.getElementById('result');
    el.textContent = 'Tanlovingni qil! 👇';
    el.className = 'result idle';
    document.getElementById('streak').innerHTML = '';
  }
</script>
</body>
</html>
